services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: ava-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - ava_qdrant_data:/qdrant/storage

volumes:
  ava_qdrant_data:
