<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AVA answers questions using SEC 10-K filing evidence." />
    <link rel="icon" type="image/png" href="./avatar/favicon.png" />
    <title>AVA — Autonomous Vehicle Analyst</title>
    <script>
      (() => {
        const saved = localStorage.getItem('ava-theme')
        const theme = saved === 'light' || saved === 'dark'
          ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
