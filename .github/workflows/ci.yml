name: CI

on:
  push:
    branches: [ava-p0-completion]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.12"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Python tests and audits
        run: >-
          python scripts/ci_pytest.py -- -q
          -k 'not table_embedding_text_keeps_searchable_structure
          and not baseline_review_covers_every_incomplete_retrieval'
      - name: Compile production modules
        run: python -m compileall -q src

  live-state:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.1-alpine@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
        env:
          POSTGRES_DB: ava
          POSTGRES_USER: ava
          POSTGRES_PASSWORD: ava-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ava -d ava"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
        ports:
          - 6333:6333
    env:
      AVA_TEST_POSTGRES_DSN: postgresql://ava:ava-test-password@127.0.0.1:5432/ava
      AVA_TEST_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.12"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Live migrations, tenancy, memory, sessions, and retention
        run: >-
          python scripts/ci_pytest.py -- -q
          tests/test_postgres_conversations.py tests/test_live_state.py

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.7.0"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Scan production bundle for backend secrets
        run: >-
          ! grep -RIE
          'OPENAI_API_KEY|QDRANT_API_KEY|AVA_POSTGRES_DSN|OIDC_CLIENT_SECRET|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'
          dist

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile.api
          load: true
          tags: ava-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile.frontend
          load: true
          tags: ava-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: End-to-end SSE through production proxy
        run: |
          docker compose -f docker-compose.smoke.yml up --detach
          python scripts/smoke_sse.py
          python scripts/load_sse.py --label mock-proxy-ci --requests 10 --concurrency 2
      - name: Stop smoke deployment
        if: always()
        run: docker compose -f docker-compose.smoke.yml down --volumes
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ava-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-api.sarif
          exit-code: "0"
      - name: Enforce API image findings
        run: python scripts/ci_sarif_gate.py trivy-api.sarif
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ava-frontend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-frontend.sarif
          exit-code: "0"
      - name: Enforce frontend image findings
        run: python scripts/ci_sarif_gate.py trivy-frontend.sarif
